</div><div id=toast></div><script>
// THE LAB PREVIEW'S LOADER (preview.py puts this file inside tarab-ai-lab-preview.html, after the debugger's page and before its drawing).
// No server. It reads video.json, then VIDEO-layers.json (layers 0–2, as the debugger's server answers /data/VIDEO.json) and each names layer
// of LAYERS, VIDEO-<name>.json (as the debugger's server answers a file given to «add layers»). Then it runs the debugger's drawing, debugger.js
// as it is, and puts the names layers on it as the debugger puts an added file. A checkbox per layer shows or hides it (the owner, 23 Nov 2026:
// «it gives the user the ability to hide/show a layer»).
// Mine: a names layer taken off closes up and comes back in its place with its colour; layers 0, 1 and 2 keep their place and are covered when
// hidden (the debugger's drawing is not changed); the row of the player's notes is closed, its height given to layers 0 and 1 (the owner: «for
// layers above layer 1, we only need to share the layers that provide the ajnas names and nothing in between»).
// Everything here sits inside one function: the drawing's own names (layout, draw, axis, ADDED, …) are reached, none is declared again.
(() => {
  const LAYERS = ["names-recording-maqam-world", "names-two-maqam-world"];                                             // the names layers, in order: VIDEO-<name>.json (written by preview.py)
  const BASE = [["l0", "layer 0 · physical"], ["l1", "layer 1 · notes"], ["l2", "layer 2 · segments"]], HIDDEN = new Set(), NAMED = [], NS = "http://www.w3.org/2000/svg";
  const mm0 = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
  const get = async f => { const r = await fetch(f, { cache: "no-store" }); if (!r.ok) throw new Error(`${f}: ${r.status}`); return r.json(); };

  // a hidden layer 0, 1 or 2: its rows covered, in the picture and in the strip of titles at the left
  function cover(svg, width, titles) {
    for (const [id, label] of BASE) {
      if (!HIDDEN.has(id)) continue;
      const [a, b] = id === "l0" ? [G.y0, G.y1 - 3] : id === "l1" ? [G.y1, G.y2 - 3] : [G.y2, G.y2 + G.h2];
      const r = document.createElementNS(NS, "rect"); Object.entries({ x: 0, y: a, width, height: b - a, class: "pvhid" }).forEach(([k, v]) => r.setAttribute(k, v)); svg.appendChild(r);
      if (titles) [[label, a + 11, "lt pvoff"], ["hidden", a + 24, "lb"]].forEach(([text, y, cls]) => { const t = document.createElementNS(NS, "text"); t.setAttribute("x", 4); t.setAttribute("y", y); t.setAttribute("class", cls); t.textContent = text; svg.appendChild(t); });
    }
  }

  function start(missing) {
    missing.forEach(f => say(`«${f}» was not found: not shown`));
    const layout0 = layout, draw0 = draw, axis0 = axis;
    layout = function () { const g = layout0(), a = Math.floor(g.hp / 2); g.h0 += a; g.yl += a; g.y1 += a; g.h1 += g.hp - a; g.yp = g.ys; g.hp = 0; return g; };
    draw = function () { draw0(); cover(el("pic"), W, false); };
    axis = function (k) { axis0(k); el("axis").querySelectorAll("text").forEach(t => { if (t.textContent === "the player's notes") t.remove(); }); cover(el("axis"), L, true); };
    const known = NAMED.filter(a => DRAWS[a.type]);
    NAMED.filter(a => !DRAWS[a.type]).forEach(a => say(`«${a.file}» is not shown: the page has no drawing for «${a.type}»`));
    ADDED.push(...known);
    const items = BASE.map(([id, label]) => [id, label, null]).concat(known.map(a => [a.file, a.name, a.c]));
    el("shown").innerHTML = items.map(([id, label, c]) => `<label class=m><input type=checkbox checked data-id='${esc(id)}'> ${c === null ? "" : `<span class=k style="background:var(--r${c % COLORS})"></span>`}${esc(label)}</label>`).join("");
    el("shown").addEventListener("change", ev => {
      const id = ev.target.dataset.id, on = ev.target.checked;
      if (BASE.some(([b]) => b === id)) on ? HIDDEN.delete(id) : HIDDEN.add(id);
      else { known.find(a => a.file === id).off = !on; ADDED.length = 0; ADDED.push(...known.filter(a => !a.off)); if (LIT && !ADDED.some(a => a.file === LIT.file)) LIT = null; }
      chips(); redraw();
    });
    chips(); redraw();
  }

  (async () => {
    let V;
    try {
      V = (await get("video.json")).video;
      if (!/^[A-Za-z0-9_-]{11}$/.test(V || "")) throw new Error("video.json names no video");
      window.D = await get(`${V}-layers.json`);
    } catch (err) { document.getElementById("tl").textContent = "nothing to show: " + err.message; return; }
    document.title = "Tarab AI lab preview · " + V; document.getElementById("rec").textContent = V;
    const seg = document.getElementById("seg");
    D.segs.forEach((s, k) => { const o = document.createElement("option"); o.value = k; o.textContent = `segment ${s.n} · ${mm0(s.from)}–${mm0(s.to)} · ${s.notes.length} notes`; seg.appendChild(o); });
    const missing = [];
    for (const [k, name] of LAYERS.entries()) {
      const file = `${V}-${name}.json`;
      try { NAMED.push({ ...(await get(file)), file, modified: Date.now(), text: "", c: k }); } catch (err) { missing.push(file); }
    }
    window.PREVIEW_START = () => start(missing);
    const js = document.createElement("script"); js.textContent = document.getElementById("drawing").textContent + "\n;PREVIEW_START();"; document.body.appendChild(js);
  })();
})();
</script><script type=text/plain id=drawing>
// THE DEBUGGER'S PAGE (debugger.py puts this file inside the page, after the data D). It draws; it measures nothing.
// One time axis: layer 0 (pitch, loudness), layer 1 (the tuner, a run of the same name a note), the notes on a staff, layer 2 (the segments).
// Below them, under layer 2: the layers added by «add layers», each file a block of its own colour (THE ADDED LAYERS, below).
const el = id => document.getElementById(id), L = 112, STEP = D.step, DUR = D.hz.length * STEP;
let PXS = D.pxs, RA = 0, RB = DUR, W = 0;                              // PXS: the zoom, pixels for a second
try { PXS = +localStorage.getItem("debugger-zoom") || D.pxs; } catch (e) {}
                                            // the stretch of the recording the picture shows: one segment, or all of it
const X = t => L + (t - RA) * PXS;
const mm = s => Math.floor(s / 60) + ":" + (s % 60).toFixed(1).padStart(4, "0"), esc = s => String(s).replace(/[&<>']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;" }[c]));
const QH = hz => (1200 * Math.log2(hz / D.do) - D.tune) / 50;          // a frequency as a height: quarter tones above the sound's own Do
const HZ = q => D.do * 2 ** ((q * 50 + D.tune) / 1200);                 // and back
function tones(q) { const a = Math.abs(Math.round(q)), w = Math.floor(a / 4), f = ["", "¼", "½", "¾"][a % 4]; return a === 0 ? "0" : (w ? w : "") + f; }
const signed = q => (q > 0 ? "+" : q < 0 ? "−" : "") + tones(q);
const SEGS = D.segs;
// each segment has its own scale of heights (its lowest note to its highest, a tone to spare each way); what sounds between two segments is drawn on the scale of the one before
SEGS.forEach((s, k) => { s.lo = Math.min(...s.q) - 2; s.hi = Math.max(...s.q) + 2; s.t0 = k ? (SEGS[k - 1].to + s.from) / 2 : 0; s.t1 = k < SEGS.length - 1 ? (s.to + SEGS[k + 1].from) / 2 : DUR;
  s.total = s.order1.reduce((a, o) => a + o[2], 0); });
const segAt = t => { for (let k = 0; k < SEGS.length; k++) if (t < SEGS[k].t1) return k; return SEGS.length - 1; };
let G = null;                                                           // the rows of the picture, from the height there is
let ONE = true, CUR = 0;                                                // one segment at a time (the default), and which
try { ONE = localStorage.getItem("debugger-one") !== "0"; } catch (e) {}

const HH = 6;                                                          // the staff on the time axis: pixels for one step of the staff (a line to the next space), fixed
let SP = { min: 0, max: 12 };                                         // the staff's lowest and highest step for the segments shown
function layout() {
  const PAD = 18;                                                                                  // under the axis: room for the sideways scroll bar
  const hj = ADDED.reduce((s, a) => s + a.h, 0);                                                    // the added layers, below the layers
  const H = el("tl").clientHeight - 14, ax = 20, h2 = 26, hs = 44, hl = 24, hu = 34, hst = Math.round((SP.max - SP.min) * HH + 10), gap = 6, rest = H - PAD - ax - h2 - hs - hu - hl - hst - 8 * gap - 4 - hj;
  const h0 = Math.max(70, Math.round(rest * 0.34)), h1 = Math.max(90, Math.round(rest * 0.36)), hp = Math.max(60, rest - h0 - h1); let y = 2; const g = { H };
  g.y0 = y; g.h0 = h0; y += h0 + 2; g.yl = y; g.hl = hl; y += hl + gap; g.y1 = y; g.h1 = h1; y += h1 + gap; g.yp = y; g.hp = hp; y += hp; g.ys = y; g.hs = hs; y += hs + gap; g.yu = y; g.hu = hu; y += hu + gap;
  g.yst = y; g.hst = hst; y += hst + gap; g.y2 = y; g.h2 = h2; y += h2 + 2; g.yj = y; y += hj; g.ya = y; g.H = Math.max(H, y + ax + PAD); return g;
}
const yIn = (s, top, h) => q => top + h - 6 - (q - s.lo) / (s.hi - s.lo) * (h - 22);           // 16 px at the top of a row are kept for its title

function draw() {
  { const sh = SEGS.filter((s, k) => ONE ? k === CUR : true).flatMap(s => s.q.map(q => written(q).pos)); SP = { min: Math.min(1, ...sh) - 1, max: Math.max(11, ...sh) + 1 }; }
  if (ONE) { RA = Math.max(0, SEGS[CUR].from - 0.4); RB = Math.min(DUR, SEGS[CUR].to + 0.4); } else { RA = 0; RB = DUR; } W = Math.ceil(X(RB) + 60);
  ADDED.forEach(a => LINES[a.type](a)); G = layout(); el("scroll").style.overflowY = G.H > el("tl").clientHeight - 14 ? "auto" : "hidden";
  const g = [], y0 = SEGS.map(s => yIn(s, G.y0, G.h0)), y1 = SEGS.map(s => yIn(s, G.y1, G.h1)), shown = SEGS.map((s, k) => ONE ? k === CUR : true), at = t => ONE ? CUR : segAt(t);
  // the long silences: a band through every layer
  D.silences.forEach(([a, d]) => { if (d >= D.cut && a + d > RA && a < RB) g.push(`<rect x=${X(Math.max(a, RA))} y=${G.y0} width=${(Math.min(a + d, RB) - Math.max(a, RA)) * PXS} height=${G.ya - G.y0} class=cutb />`); });
  // the seconds
  for (let s = Math.ceil(RA); s <= RB; s++) g.push(`<line x1=${X(s)} y1=${G.y0} x2=${X(s)} y2=${G.ya + 5} class=grid /><text x=${X(s)} y=${G.ya + 16} class=tk text-anchor=middle>${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}</text>`);
  let tk = ""; for (let i = Math.ceil(RA * 10); i <= RB * 10; i++) if (i % 10) tk += `M${X(i / 10)} ${G.ya}v${i % 5 ? 3 : 5}`; g.push(`<path d="${tk}" class=tick />`);
  // the notes of each segment as faint lines through layers 0 and 1
  SEGS.forEach((s, k) => { if (shown[k]) s.q.forEach(q => g.push(`<path d="M${X(s.from)} ${y0[k](q).toFixed(1)}H${X(s.to)}M${X(s.from)} ${y1[k](q).toFixed(1)}H${X(s.to)}" class=pl />`)); });
  // LAYER 0: the pitch every 10 ms; a pitch outside the segment's heights is drawn on the row's edge, pale
  const i0 = Math.max(0, Math.floor(RA / STEP)), i1 = Math.min(D.hz.length, Math.ceil(RB / STEP));
  const dots = (arr, cls, out) => { let a = "", b = ""; for (let i = i0; i < i1; i++) { if (!arr[i]) continue; const t = i * STEP, k = at(t), s = SEGS[k], q = QH(arr[i]);
      if (q < s.lo - .5 || q > s.hi + .5) { if (out) b += `M${X(t).toFixed(1)} ${(q < s.lo ? G.y0 + G.h0 - 2 : G.y0 + 17)}h.01`; } else a += `M${X(t).toFixed(1)} ${y0[k](q).toFixed(1)}h.01`; }
    g.push(`<path d="${a}" class=${cls} />`); if (out) g.push(`<path d="${b}" class=${out} />`); };
  dots(D.hz, "d0", "d0o");
  const dmin = Math.min(...D.db), dmax = Math.max(...D.db); let lp = ""; for (let i = i0; i < i1; i++) lp += (i > i0 ? "L" : "M") + X(i * STEP).toFixed(1) + " " + (G.yl + G.hl - 1 - (D.db[i] - dmin) / (dmax - dmin) * (G.hl - 2)).toFixed(1); g.push(`<path d="${lp}" class=loud />`);
  // LAYER 1: the notes.
  SEGS.forEach((s, k) => { if (shown[k]) s.notes.forEach((n, i) => { const [t, d, p, heard, own, off, db, turn, hang] = n, q = s.q[p], a = X(t), w = Math.max(d * PXS, 2), y = y1[k](q);

// THE STAFF: the sound's own Do written as middle C; a note's place on it and its accidental
const CLEF_SIZE = 13.5, CLEF_DY = 2.6;        // the clef's glyph, in half-spaces of the staff: its size, and how far under the bottom line its baseline lies

function accidental(acc, ax, cy, k) {                 // ♭, half-flat (♭ with a stroke), ♯, half-sharp (one stem); k scales the drawing
  const f = v => (v * k).toFixed(1); let o = "";

  if (acc.includes("♯")) o += `<path d="${acc[0] === "½" ? `M${ax.toFixed(1)} ${(cy - 8 * k).toFixed(1)}v${f(16)}` : `M${(ax - 2 * k).toFixed(1)} ${(cy - 7.5 * k).toFixed(1)}v${f(16)}M${(ax + 2 * k).toFixed(1)} ${(cy - 8.5 * k).toFixed(1)}v${f(16)}`}M${(ax - 5 * k).toFixed(1)} ${(cy - 1.5 * k).toFixed(1)}l${f(10)} ${f(-3)}M${(ax - 5 * k).toFixed(1)} ${(cy + 4.5 * k).toFixed(1)}l${f(10)} ${f(-3)}" class=accl />`;
  return o;

// THE SEGMENT'S STAFF in the side panel: the notes of the segment in view, each once, low to high, with the distance between neighbours
let PK = -1;

  g.push(`<text x=8 y=${y(2) + h * CLEF_DY} class=clef font-size=${h * CLEF_SIZE}>𝄞</text>`);

// THE ADDED LAYERS (the owner, 22 Nov 2026: «the debugger has an option 'add layers', which is file upload. once uploaded, per type of layer, it will
// display it. for now we have one additional layer type, which is JINS. later perhaps we will add more»). A file is sent to the server (debugger.py
// «added»), which reads it against layer 2 and answers with what is drawn here, or with why it is refused; this file only draws. A type has two
// entries: LINES (how many lines it takes in the stretch shown) and DRAWS (its drawing). As many files as the owner adds (the owner, 23 Nov 2026:
// «Please allow debugger as many layers as I please»). A file's colour stays its own while it is shown; there are COLORS colours, and from the fifth
// file on they come round again in the same order (mine), each file still on its own lines with its name at the left. The same file added again
// takes the place (and the colour) of the one shown.
const COLORS = 4, BARH = 13, BARGAP = 2, REPEAT = 900, NOTICE_S = 6;      // BARH, BARGAP: a bar's height and the room under it, pixels; REPEAT: a long bar writes its name again every so many pixels (as the segments' row does); NOTICE_S: a notice goes after so many seconds
const KEPT = "debugger-added:" + D.video, KEPT_NAMES = "debugger-added-names:" + D.video, FONT_JT = "10px -apple-system, system-ui, sans-serif", FONT_LT = "600 11px -apple-system, system-ui, sans-serif";

const CTX = document.createElement("canvas").getContext("2d"), textW = (s, font) => { CTX.font = font; return CTX.measureText(s).width; };
const escA = s => esc(s).replace(/"/g, "&quot;");

  jins(a) {                                                              // the bars that sound in the stretch shown, each on the first line that is free where it begins
    const end = []; a.lane = {}; a.shown = a.bars.map((b, n) => n).filter(n => a.bars[n].b > RA && a.bars[n].a < RB).sort((x, y) => a.bars[x].a - a.bars[y].a || x - y);
    a.shown.forEach(n => { const b = a.bars[n]; let l = end.findIndex(e => e <= b.a + 1e-9); if (l < 0) l = end.length; end[l] = b.b; a.lane[n] = l; });
    a.h = Math.max(1, end.length) * (BARH + BARGAP) + 4; } };
const DRAWS = {
  jins(a, f, g) {                                                        // thin bars, the name at the centre (and again every REPEAT pixels along a long bar); a name that does not fit is in the bar's title
    a.shown.forEach(n => { const b = a.bars[n], x0 = X(Math.max(b.a, RA)), x1 = X(Math.min(b.b, RB)), w = Math.max(x1 - x0, 2), y = a.y + 2 + a.lane[n] * (BARH + BARGAP), tw = textW(b.name, FONT_JT), c = (x0 + x1) / 2, room = w / 2 - tw / 2 - 4;
      g.push(`<rect x=${x0.toFixed(1)} y=${y} width=${w.toFixed(1)} height=${BARH} rx=3 class=jb style="fill:var(--r${a.c % COLORS});stroke:var(--r${a.c % COLORS})" data-f=${f} data-b=${n}><title>${esc(b.name)} · ${esc(where(b))} · ${esc(a.name)}</title></rect>`);
      if (room >= 0) for (let k = -Math.floor(room / REPEAT); k <= Math.floor(room / REPEAT); k++) g.push(`<text x=${(c + k * REPEAT).toFixed(1)} y=${y + BARH - 3.5} class=jt text-anchor=middle>${esc(b.name)}</text>`); }); } };
LINES.trend = LINES.jins; DRAWS.trend = DRAWS.jins;                     // TREND: the same bars as JINS, under its own type
function say(text) { const d = document.createElement("div"); d.textContent = text; el("toast").appendChild(d); setTimeout(() => d.remove(), NOTICE_S * 1000); }      // a small notice that goes by itself
function keep() { try { localStorage.setItem(KEPT_NAMES, JSON.stringify(ADDED.map(a => a.file))); localStorage.setItem(KEPT, JSON.stringify(ADDED.map(a => ({ file: a.file, modified: a.modified, text: a.text, c: a.c })))); } catch (e) {} }      // best effort: what cannot be kept is said after the reload
async function addOne(file, modified, text, c) {
  let r; try { r = await (await fetch("add/" + encodeURIComponent(D.video), { method: "POST", body: text })).json(); } catch (e) { r = { refused: "the debugger's server did not answer" }; }
  const was = ADDED.findIndex(a => a.file === file);
  if (r.refused) { say(`«${file}» is not shown: ${r.refused}`); return; }
  const used = new Set(ADDED.filter((a, i) => i !== was).map(a => a.c)); let k = 0; while (used.has(k)) k++;      // the first place in the order that no file shown holds
  const one = { file, modified, text, c: was >= 0 ? ADDED[was].c : Number.isInteger(c) && !used.has(c) ? c : k, ...r };

async function addFiles(files) { for (const f of [...files]) await addOne(f.name, f.lastModified, await f.text()); el("addf").value = ""; keep(); chips(); redraw(); }
async function restore() {                                               // after a reload: the files kept for this recording are read again by the server; one that is gone is said in a notice, nothing more
  let names = [], kept = []; try { names = JSON.parse(localStorage.getItem(KEPT_NAMES) || "[]"); kept = JSON.parse(localStorage.getItem(KEPT) || "[]"); } catch (e) { return; }
  if (!names.length && !kept.length) return;
  names.filter(n => !kept.some(k => k.file === n)).forEach(n => say(`«${n}» could not be brought back: add it again`));
  for (const k of kept) await addOne(k.file, k.modified, k.text, k.c);
  keep(); chips(); redraw();
}
function removeAdded(f) { if (LIT && LIT.file === ADDED[f].file) LIT = null; ADDED.splice(f, 1); keep(); chips(); redraw(); }
function chips() { el("added").innerHTML = ADDED.map((a, f) => `<span class=chip title="${escA(`${a.type} · ${a.bars.length} bars · the file ${a.file}, written ${new Date(a.modified).toLocaleString()}`)}"><i style="background:var(--r${a.c % COLORS})"></i>${esc(a.type)} · ${esc(a.name)}<button onclick="removeAdded(${f})" title="take this layer off the picture">✕</button></span>`).join(""); }

// A CLICK ON A BAR lights the notes of its «because»: a line of the file's colour under each, with what it counted as (over the note when a ▼ is under it). The same bar again puts them out.
function light(f, b) { LIT = LIT && LIT.file === ADDED[f].file && LIT.b === b ? null : { file: ADDED[f].file, b }; lights(); }
function lights() {
  const box = el("lit"); if (!box) return; document.querySelectorAll(".jb.lit").forEach(e => e.classList.remove("lit")); const g = [], f = LIT ? ADDED.findIndex(a => a.file === LIT.file) : -1;
  if (f >= 0 && ADDED[f].bars[LIT.b]) { const a = ADDED[f], r = document.querySelector(`.jb[data-f="${f}"][data-b="${LIT.b}"]`); if (r) r.classList.add("lit");
    a.bars[LIT.b].because.forEach(([k, i, key]) => { if (ONE && k - 1 !== CUR) return; const s = SEGS[k - 1], n = s.notes[i - 1], x = X(n[0]), w = Math.max(n[1] * PXS, 2), y = yIn(s, G.y1, G.h1)(s.q[n[2]]);
      g.push(`<line x1=${x.toFixed(1)} y1=${(y + 9).toFixed(1)} x2=${(x + w).toFixed(1)} y2=${(y + 9).toFixed(1)} class=bq style="stroke:var(--r${a.c % COLORS})" /><text x=${(x + w / 2).toFixed(1)} y=${(n[7] < 0 ? y - 19 : y + 21).toFixed(1)} class=bk text-anchor=middle>${esc(key)}</text>`); }); }
  else LIT = null;
  box.innerHTML = g.join("");
}

// PLAY ONLY A SELECTED AREA (the owner, 20 Nov 2026: «can I request for a feature to play "selected area" only in the debugger? I need to debug those pieces
// separatly»): drag across the picture, or type note numbers of the segment in view («2-15», both ends in); Play then plays only that and stops at its end.
// A link can carry the area too: «?v=VIDEO&range=41.3-45.1», in seconds (read where the page starts, at the bottom of this file).
let SEL = null, DRAG = null;
function band(a, b) { let r = el("selband"); if (!r) { r = document.createElementNS("http://www.w3.org/2000/svg", "rect"); r.id = "selband"; r.setAttribute("class", "selb"); r.setAttribute("y", G.y0); r.setAttribute("height", G.ya - G.y0); el("pic").insertBefore(r, el("cur")); } r.setAttribute("x", X(a)); r.setAttribute("width", Math.max(1, (b - a) * PXS)); }
function select(a, b, how) { SEL = { a, b }; band(a, b); if (how === "drag") el("sel").value = `${mm(a)}–${mm(b)}`; seek(a); }
function selNotes(v) { const m = String(v).match(/(\d+)\s*[-–]\s*(\d+)/); if (!m) { selClear(); return; } const s = SEGS[CUR], i = Math.max(1, Math.min(+m[1], +m[2])), j = Math.min(s.notes.length, Math.max(+m[1], +m[2])); if (i > s.notes.length) return;
  const a = s.notes[i - 1][0], b = s.notes[j - 1][0] + s.notes[j - 1][1]; el("sel").value = `${i}-${j}`; select(a, b, "notes"); const box = el("scroll"); box.scrollLeft = X(a) - L - 40; }
function clickSeek(t) { if (SEL && (t < SEL.a - 0.01 || t > SEL.b + 0.01)) selClear(); seek(t); }      // a click outside the selection ends it
function selClear() { SEL = null; el("sel").value = ""; const r = el("selband"); if (r) r.remove(); }

// THE PLAYING
let yt = null, ready = false, pending = null, playing = false, timer = null, RATE = 1, NOW = SEGS[0].from, focus = -1, lit = null;
try { RATE = +localStorage.getItem("debugger-speed") || 1; } catch (e) {}
function speed(r) { RATE = +r; try { localStorage.setItem("debugger-speed", RATE); } catch (e) {} if (ready) yt.setPlaybackRate(RATE); }
function zoom(z, t, px) { PXS = +z; el("zoom").value = String(PXS); try { localStorage.setItem("debugger-zoom", PXS); } catch (e) {} draw(); el("scroll").scrollLeft = t === undefined ? X(NOW) - el("scroll").clientWidth / 2 : X(t) - px; }
// cmd+scroll (or a pinch) over the picture: the next zoom step in or out, the moment under the mouse staying where it is
const ZOOMS = [240, 480, 960, 1920, 3840]; let WACC = 0;
function wheelZoom(ev) { if (!ev.metaKey && !ev.ctrlKey) return; ev.preventDefault(); WACC += ev.deltaY; if (Math.abs(WACC) < 40) return;
  const i = ZOOMS.indexOf(PXS), j = Math.max(0, Math.min(ZOOMS.length - 1, (i < 0 ? ZOOMS.findIndex(z => z >= PXS) : i) + (WACC < 0 ? 1 : -1))); WACC = 0; if (ZOOMS[j] === PXS) return;
  const box = el("scroll"), px = ev.clientX - box.getBoundingClientRect().left, t = RA + (box.scrollLeft + px - L) / PXS; zoom(ZOOMS[j], t, px); }
function single(on) { ONE = !!on; try { localStorage.setItem("debugger-one", ONE ? "1" : "0"); } catch (e) {} CUR = segAt(NOW); draw(); }
function api() { if (window.YT || el("ytapi")) return; const s = document.createElement("script"); s.id = "ytapi"; s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s); }
window.onYouTubeIframeAPIReady = () => { yt = new YT.Player("yt", { host: "https://www.youtube.com", videoId: D.video, playerVars: { rel: 0, playsinline: 1, enablejsapi: 1, start: Math.floor(NOW) },
  events: { onReady: () => { ready = true; yt.setPlaybackRate(RATE); if (pending !== null) { const p = pending; pending = null; seek(p); } }, onStateChange: ev => state(ev.data === 1 || ev.data === 3) } }); };
function state(on) { playing = on; el("pp").textContent = on ? "❚❚ Pause" : "▶ Play"; clearInterval(timer); if (on) timer = setInterval(tick, 40); }
function toggle() { if (playing) { yt.pauseVideo(); state(false); return; }
  if (SEL && (NOW >= SEL.b - 0.02 || NOW < SEL.a - 0.05)) NOW = SEL.a;                                     // a selection: Play begins it again
  else if (!SEL && ONE && (NOW >= SEGS[CUR].to || NOW < SEGS[CUR].from - 0.5)) NOW = SEGS[CUR].from;        // the segment was played to its end: Play begins it again
  if (!ready) { pending = NOW; api(); return; } yt.setPlaybackRate(RATE); yt.seekTo(NOW, true); yt.playVideo(); state(true); }
function seek(t) { NOW = t; if (ONE && segAt(t) !== CUR) { CUR = segAt(t); draw(); } else mark(t, true); if (!ready) { pending = t; api(); return; } yt.setPlaybackRate(RATE); yt.seekTo(t, true); yt.playVideo(); state(true); }
function tick() { if (!yt || !yt.getCurrentTime) return; NOW = yt.getCurrentTime(); mark(NOW, true); if (NOW >= (SEL ? SEL.b : ONE ? SEGS[CUR].to + 0.3 : DUR)) { yt.pauseVideo(); state(false); if (SEL) { NOW = SEL.b; mark(NOW, false); } } }      // one segment at a time: the playing stops at the segment's end
function show(k) { if (k === focus) return; focus = k; lit = null; axis(k); table(k); if (PK !== k) segStaff(k); }
const TAGS = [["h", "a hang"], ["u", "▲ top turn"], ["d", "▼ bottom turn"]];
function mark(now, follow) {
  const c = el("cur"), x = X(now), box = el("scroll"); c.setAttribute("x1", x); c.setAttribute("x2", x);
  if (follow && (x < box.scrollLeft + L + 30 || x > box.scrollLeft + box.clientWidth - 200)) box.scrollLeft = x - L - 60;           // the picture follows the playing
  const k = ONE ? CUR : segAt(now), s = SEGS[k]; show(k);
  let on = -1; for (let i = 0; i < s.notes.length; i++) if (now >= s.notes[i][0] && now < s.notes[i][0] + s.notes[i][1]) on = i;
  const hz = D.hz[Math.round(now / STEP)]; el("hznow").textContent = hz ? hz.toFixed(1) + " Hz" : "—";
  const key = k + ":" + on; if (key === lit) return; lit = key;
  document.querySelectorAll(".sounding").forEach(e => e.classList.remove("sounding")); const lights = {};
  if (on < 0) { el("nowname").textContent = now < s.from || now > s.to ? "silence" : "between notes"; el("nowline").textContent = ""; }
  else { const [t, d, p, heard, own, off, db, turn, hang] = s.notes[on], prev = on ? s.q[p] - s.q[s.notes[on - 1][2]] : null;
    document.querySelectorAll(`.note[data-k="${k}"][data-i="${on}"], #pic .tn[data-k="${k}"][data-i="${on}"], #pstaff .sn1[data-p="${p}"], #tbl tr[data-p="${p}"]`).forEach(e => e.classList.add("sounding"));
    const row = document.querySelector(`#tbl tr[data-p="${p}"]`), tb = el("tblbox"); if (row && (row.offsetTop < tb.scrollTop + 24 || row.offsetTop > tb.scrollTop + tb.clientHeight - 40)) tb.scrollTop = row.offsetTop - tb.clientHeight / 2;
    el("nowname").textContent = `note ${on + 1} · ${s.names[p]} · ${d.toFixed(2)} s`;
    el("nowline").textContent = `at ${mm(t)} · heard at ${heard.toFixed(1)} Hz · the note's own ${own.toFixed(1)} Hz (${off > 0 ? "+" : ""}${off.toFixed(0)} cents) · ${db.toFixed(0)} dB${prev === null ? "" : ` · step from note ${on}: ${signed(prev)}`}`;
    lights.h = !!hang; lights.u = turn > 0; lights.d = turn < 0; }
  TAGS.forEach(([id]) => el("tag-" + id).classList.toggle("on", !!lights[id]));
}
(() => { el("speed").value = String(RATE); el("zoom").value = String(PXS); el("one").checked = ONE; el("nowtags").innerHTML = TAGS.map(([id, text]) => `<span class="tag ${id}" id=tag-${id}>${text}</span>`).join("");
  const rg = (new URLSearchParams(location.search).get("range") || "").match(/^\s*(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)\s*$/);      // a link with «range=41.3-45.1» (seconds; the owner,
  if (rg && +rg[2] > +rg[1] && +rg[1] < DUR) { SEL = { a: +rg[1], b: Math.min(DUR, +rg[2]) }; NOW = SEL.a; }                          // 22 Nov 2026): opened with that stretch selected; Play plays only that
  CUR = segAt(NOW); draw(); api(); restore();
  if (SEL) { el("sel").value = `${mm(SEL.a)}–${mm(SEL.b)}`; el("scroll").scrollLeft = X(SEL.a) - L - 40; } else el("scroll").scrollLeft = 0;
  el("scroll").addEventListener("wheel", wheelZoom, { passive: false });
  el("scroll").addEventListener("scroll", () => { el("axis").style.top = -el("scroll").scrollTop + "px"; if (!playing && !ONE) { const b = el("scroll"), x = X(NOW); if (x < b.scrollLeft + L || x > b.scrollLeft + b.clientWidth) show(segAt(RA + (b.scrollLeft + (b.clientWidth + L) / 2 - L) / PXS)); else if (focus !== segAt(NOW)) mark(NOW); } });
  let rz = null, seen = el("tl").clientHeight + "x" + el("tl").clientWidth;                // the picture is drawn again when the room for it changes
  new ResizeObserver(() => { const now = el("tl").clientHeight + "x" + el("tl").clientWidth; if (now === seen) return; seen = now; clearTimeout(rz); rz = setTimeout(draw, 120); }).observe(el("tl"));
  addEventListener("keydown", ev => { if (ev.code === "Space" && !/^(SELECT|BUTTON|INPUT)$/.test(ev.target.tagName)) { ev.preventDefault(); toggle(); } }); })();
</script></body></html>
